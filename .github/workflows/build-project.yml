name: Manual Project Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build Target'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

jobs:
  build:
    name: 🏗️ Build Project (Manual Button Trigger)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Vite / Web App
        run: npm run build

      - name: 📤 Upload Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist
          retention-days: 14
