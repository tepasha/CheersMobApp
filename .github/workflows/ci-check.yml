name: CI Code Quality & Build Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: ⚡ Fast Validation & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 ESLint & TypeScript Check
        run: npm run lint

      - name: 🧪 Run Unit Test Suite (Vitest)
        run: npm test

      - name: 🏗️ Production Build Check
        run: npm run build
