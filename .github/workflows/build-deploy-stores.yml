name: Build & Release to Apple & Android Stores

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - release/*
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build & release'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: 'EAS Build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      auto_submit:
        description: 'Automatically submit to Stores (App Store / Google Play)'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 🔍 Lint & Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Linter & Typecheck
        run: npm run lint

  # ==========================================
  # iOS Build & App Store Connect / TestFlight
  # ==========================================
  build-ios:
    name: 🍏 Build & Submit iOS (App Store)
    needs: validate
    if: |
      github.event_name == 'push' || 
      github.event.inputs.platform == 'all' || 
      github.event.inputs.platform == 'ios'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🚀 Setup EAS & Expo CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Configure App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            mkdir -p private_keys
            echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
            echo "✅ App Store Connect AuthKey written to private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          else
            echo "ℹ️ Using EAS managed App Store credentials"
          fi

      - name: 🔨 EAS Build for iOS
        id: build-ios-step
        env:
          PROFILE: ${{ github.event.inputs.profile || 'production' }}
        run: |
          echo "Building iOS with profile: $PROFILE"
          eas build \
            --platform ios \
            --profile "$PROFILE" \
            --non-interactive \
            --auto-submit-with-profile="$PROFILE" \
            --json > ios-build-result.json
          cat ios-build-result.json

      - name: 📤 Upload Build Metadata Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-metadata
          path: ios-build-result.json
          retention-days: 14

  # ==========================================
  # Android Build & Google Play Console
  # ==========================================
  build-android:
    name: 🤖 Build & Submit Android (Google Play)
    needs: validate
    if: |
      github.event_name == 'push' || 
      github.event.inputs.platform == 'all' || 
      github.event.inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🚀 Setup EAS & Expo CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔑 Configure Google Play Service Account
        env:
          GOOGLE_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_BASE64" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT_BASE64" | base64 --decode > google-service-account.json
            echo "✅ Google Service Account JSON written to google-service-account.json"
          else
            echo "ℹ️ Using EAS managed Android credentials"
          fi

      - name: 🔨 EAS Build for Android (AAB)
        id: build-android-step
        env:
          PROFILE: ${{ github.event.inputs.profile || 'production' }}
        run: |
          echo "Building Android with profile: $PROFILE"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --auto-submit-with-profile="$PROFILE" \
            --json > android-build-result.json
          cat android-build-result.json

      - name: 📤 Upload Build Metadata Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-metadata
          path: android-build-result.json
          retention-days: 14
